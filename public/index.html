<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Le-Gacy's Importation</title>
  <meta name="description" content="Imported phone accessories, kitchenware, jewelry, shoes, bags, home textile, sportswear and women's wear. Shop online and pay securely with Paystack.">
  <meta name="theme-color" content="#7C5DD9">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=product-colors-20261029">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div id="shell">
    <header class="top">
      <div class="wrap top-in">
        <a class="brand" href="#/" aria-label="Le-Gacy's Importation, home">
          <span class="brand-mark" aria-hidden="true">L</span>
          <span class="brand-name"><span class="brand-primary">Le-Gacy's</span><span class="brand-secondary">Importation</span></span>
        </a>
        <nav class="top-nav" aria-label="Main">
          <a href="#/" data-nav="home">Home</a>
          <a href="#/shop" data-nav="shop">Shop</a>
          <a href="#/track" data-nav="track">Track order</a>
        </nav>
        <button class="cart-btn" id="cartBtn" type="button" aria-label="Open cart">
          <span class="cart-ico" aria-hidden="true"></span>
          <span class="cart-label">Cart</span>
          <span class="badge" id="cartCount" hidden>0</span>
        </button>
      </div>
    </header>

    <main id="main" tabindex="-1" aria-live="polite">
      <div class="wrap"><p class="muted pad">Loading the store…</p></div>
    </main>

    <footer id="footer"></footer>

    <nav class="tabbar" aria-label="Quick navigation">
      <a href="#/" data-nav="home"><span class="tab-ico" data-icon="home"></span>Home</a>
      <a href="#/shop" data-nav="shop"><span class="tab-ico" data-icon="grid"></span>Shop</a>
      <a href="#/track" data-nav="track"><span class="tab-ico" data-icon="truck"></span>Track</a>
      <button type="button" id="tabCart"><span class="tab-ico" data-icon="bag"></span>Cart<span class="badge" id="tabCount" hidden>0</span></button>
    </nav>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true">
    <div class="drawer-head">
      <h2 id="drawerTitle">Your cart</h2>
      <button type="button" class="icon-btn" id="drawerClose" aria-label="Close cart"></button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-foot" id="drawerFoot"></div>
  </aside>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">This store needs JavaScript. You can still order on WhatsApp: 0266901277.</p></noscript>
  <script src="https://js.paystack.co/v1/inline.js" defer></script>
  <script src="/app.js?v=product-colors-20261029" defer></script>
</body>
</html>
